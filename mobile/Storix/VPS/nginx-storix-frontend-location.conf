# KHÔNG thay thế toàn bộ file Nginx production hiện có.
# Chèn các dòng bên dưới VÀO server { ... listen 443 ssl; server_name storixapi.duckdns.org; ... }
# Giữ nguyên location /api/ đang proxy tới ASP.NET Core Kestrel!
# Nếu có 'location /' thì CHỈ SỬA location cũ, không tạo thêm một location / trùng.

root /var/www/storix-web;
index index.html;

location / {
    try_files $uri $uri/ /index.html;
}

# Không cache index.html để các bản triển khai mới được tải ngay.
location = /index.html {
    add_header Cache-Control "no-cache";
}
